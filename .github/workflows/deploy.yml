name: Build and Deploy

on:
  push:
    branches:
      - shivani-portfolio-cms  # Trigger deployment when pushing to the main branch

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v5

      # 2. Setup PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, mysql, zip

      # 3. Install Composer dependencies (optimizing for production)
      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # 4. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'

      # 5. Install NPM dependencies and build production assets (Inertia/Vite)
      - name: Install & Build Assets
        run: |
          npm install
          npm run build

      # 6. Deploy to Hostinger via FTP/SFTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SHIVANI_PORTFOLIO_FTP_SERVER }}
          username: ${{ secrets.SHIVANI_PORTFOLIO_FTP_USERNAME }}
          password: ${{ secrets.SHIVANI_PORTFOLIO_FTP_PASSWORD }}
          port: ${{ secrets.SHIVANI_PORTFOLIO_FTP_PORT || 21 }} # Defaults to 21 for FTP, use 22 for SFTP
          local-dir: ./ # Upload all files in the root
          server-dir:  ${{ secrets.SHIVANI_PORTFOLIO_SERVER_DIR || './' }} # Update to match your Hostinger destination path
          log-level: verbose
          # List of files/folders to exclude from the upload
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env*
            **/.github/**
            **/install.ps1
            **/sync_tools.py
            **/phpunit.xml
            **/composer.lock
            **/package-lock.json
            **/eslint.config.js
            **/tsconfig.json
            **/vite.config.ts
            **/phpstan.neon
            **/pint.json
            **/components.json
            **/entities.json
            **/mempalace.yaml
            **/pnpm-workspace.yaml
            **/graphify-out/**
            **/.code-review-graph/**
            **/.agents/**
